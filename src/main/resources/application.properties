spring.application.name=taskflow
server.port=${PORT:8080}
# Let the servlet container translate forwarding headers into getRemoteAddr()/getScheme()
server.forward-headers-strategy=native

# Database configuration
spring.datasource.url=${MYSQL_PUBLIC_URL:jdbc:mysql://localhost:3306/taskflow?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# Redis Configuration (defaults to localhost:6379, configurable via env)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.timeout=5000

# Cache type
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# JWT Configuration
# Required: Base64 string decoding to at least 32 bytes. Generate with: openssl rand -base64 48
taskflow.jwt.secret=${JWT_SECRET:}
taskflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated list of extra origins allowed to call /api/** (same-origin needs none)
taskflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}